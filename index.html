<head>

    <!-- Nombre que aparecerá en la pestaña del navegador -->

<body>

        <!-- Representa un esqueleto en estado de reposo -->

            <!-- Botón que activa la acción de bailar al esqueleto-->

                Bailar 
            </div>
        </div>
    </div>

    <!-- Conexión al archivo JavaScript para llamarlo  uujjjjjjjjjj
